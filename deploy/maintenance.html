<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Auto-retry: the page reloads itself until the backend is back. -->
  <meta http-equiv="refresh" content="15">
  <title>Deploying — BP Decomp</title>
  <style>
    /* The shared Paradise palette (b5-decomp-webui), inlined so this page needs
       nothing from the app, which is restarting while it shows. */
    :root {
      --bg: #100e0e;
      --surface: #151212;
      --line: #49302f;
      --text: #f1eee5;
      --muted: #c6b9ab;
      --red: #e72530;
      --gold: #edbd54;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(120% 120% at 50% 0%, #1e1716 0%, var(--bg) 70%);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      padding: 40px 36px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 3px solid var(--red);
      box-shadow: 8px 12px 0 rgba(8, 7, 7, 0.4);
    }
    h1 {
      margin: 0 0 14px;
      font-family: Impact, "Arial Narrow", sans-serif;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-size: 28px;
      color: var(--gold);
    }
    p { margin: 0 0 10px; color: var(--muted); line-height: 1.5; }
    .spinner {
      width: 38px; height: 38px;
      margin: 0 auto 26px;
      border: 3px solid var(--line);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { margin-top: 18px; font-size: 12px; color: #8b8175; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Deploying a new version</h1>
    <p>The site is updating and will be back in a few moments.</p>
    <p>This page refreshes automatically.</p>
    <p class="hint">If this persists for more than a few minutes, the deploy may have failed.</p>
  </div>
</body>
</html>
