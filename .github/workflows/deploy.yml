name: Deploy to Server

on:
  push:
    branches:
      - main

# Avoid overlapping deploys; only the latest push matters.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: adriwin.fr
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # The tree is owned by bpwork; let root's git work in it and in the UI submodule.
            for dir in /opt/bp-work-server /opt/bp-work-server/bp_work_server/static/b5-ui; do
              git config --global --get-all safe.directory | grep -Fxq "$dir" || \
                git config --global --add safe.directory "$dir"
            done
            cd /opt/bp-work-server
            # Raise the maintenance curtain: nginx serves the static page while this exists.
            touch /opt/bp-work-server/maintenance.flag
            git fetch origin main
            git reset --hard origin/main
            # The dashboard's UI library is a submodule (b5-decomp-webui, dist branch).
            git submodule sync --recursive
            git submodule update --init --recursive --force
            # Reinstall in case dependencies or the package metadata changed.
            .venv/bin/pip install -e . --quiet
            # The byte-match runner runs as root from its own copy, once it is set up
            # (deploy/bytematch/README.md): refresh the copy and its units from this tree.
            if [ -d /usr/local/lib/bp-bytematch ]; then
              install -m 755 deploy/bytematch/runner.py /usr/local/lib/bp-bytematch/runner.py
              install -m 644 deploy/bytematch/bp-bytematch.service deploy/bytematch/bp-bytematch.path \
                deploy/bytematch/bp-bytematch.timer /etc/systemd/system/
              systemctl daemon-reload
            fi
            # The service runs as bpwork; keep the tree owned by it.
            chown -R bpwork:bpwork /opt/bp-work-server
            systemctl restart bp-work-server.service
            # Wait for the app to actually answer before dropping the curtain.
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://127.0.0.1:8765/; then
                break
              fi
              sleep 1
            done
            # Lower the curtain (kept up if deploy failed earlier, thanks to set -e).
            rm -f /opt/bp-work-server/maintenance.flag
            systemctl --no-pager status bp-work-server.service | head -n 5
